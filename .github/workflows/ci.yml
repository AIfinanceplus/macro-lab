name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m unittest -v test_macro_agent_lab.py
      - run: ruff check --select E4,E7,E9,F macro_lab serve_macro_lab.py test_macro_agent_lab.py
      - run: node --check web/macro_lab.js && node --check web/macro_architecture.js
